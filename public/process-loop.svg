<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 100 960 200" role="img" aria-label="Animation: scrap PET bottles move along a belt, are baled, crushed into flakes and packed into a bulk bag">
<style>
  .spin-fast { animation: spin 1.5s linear infinite; }
  .gear-a { animation: spin 9s linear infinite reverse; }
  .gear-b { animation: spin 9s linear infinite; }
  .row1 { animation: row1 9s linear infinite; }
  .row2 { animation: row2 3s linear infinite; }
  .row3 { animation: row3 3s linear infinite; }
  .ram { animation: ram 3s ease-in-out infinite; }
  .lamp { animation: lamp 3s ease-in-out infinite; }
  .drop { transform-box: fill-box; transform-origin: center; animation: drop 1.5s linear infinite; }
  .bagdrop { transform-box: fill-box; transform-origin: center; animation: bagdrop 1.5s ease-in infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes row1 { to { transform: translateX(240px); } }
  @keyframes row2 { to { transform: translateX(120px); } }
  @keyframes row3 { to { transform: translateX(66px); } }
  @keyframes ram { 0%, 25% { transform: translateY(0); } 50%, 60% { transform: translateY(20px); } 85%, 100% { transform: translateY(0); } }
  @keyframes lamp { 0%, 30% { opacity: .25; } 50%, 60% { opacity: 1; } 85%, 100% { opacity: .25; } }
  @keyframes drop {
    0% { transform: translate(0, 0) rotate(0deg); opacity: 0; }
    12% { opacity: 1; }
    85% { opacity: 1; }
    100% { transform: translate(12px, 40px) rotate(140deg); opacity: 0; }
  }
  @keyframes bagdrop {
    0% { transform: translate(0, 0) rotate(0deg); opacity: 0; }
    12% { opacity: 1; }
    50% { transform: translate(20px, 2px) rotate(70deg); }
    85% { opacity: 1; }
    100% { transform: translate(36px, 30px) rotate(150deg); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
